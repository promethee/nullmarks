<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nullmarks</title>
<!-- An inline icon stops the browser from requesting /favicon.ico. It must be
     a decodable image: an empty "data:," makes Chromium fall back to the file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fde'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4;
  --fg: #1d1d1b;
  --muted: #6b6b66;
  --card: #ffffff;
  --line: #dcdcd8;
  --accent: #2f6fde;
  --bar: #fff4d6;
  --error: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615;
    --fg: #ececea;
    --muted: #9a9a94;
    --card: #222220;
    --line: #3a3a37;
    --accent: #7aa7ff;
    --bar: #3a3217;
    --error: #ff8a80;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  font: 15px/1.4 system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
}
header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  gap: .5rem;
  padding: .75rem 1rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
input, button { font: inherit; color: inherit; }
input {
  padding: .45rem .6rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
}
#filter { flex: 1; min-width: 0; }
button {
  padding: .4rem .75rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  cursor: pointer;
}
button:hover, button:focus-visible { border-color: var(--accent); }
.bar {
  margin: .75rem 1rem 0;
  padding: .5rem .75rem;
  border-radius: 6px;
  background: var(--bar);
}
.bar button { margin-left: .5rem; }
.error { color: var(--error); }
main { padding: 1rem; }
.hint { margin: 4rem 1rem; text-align: center; color: var(--muted); font-size: 1.1rem; }
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
  gap: .5rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.item { position: relative; }
.bm {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .5rem 2rem .5rem .5rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: inherit;
  text-decoration: none;
}
.bm:hover, .bm:focus-visible { border-color: var(--accent); outline: none; }
.tile {
  flex: none;
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: 6px;
  color: #fff;
  font-weight: 600;
}
.label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.more {
  position: absolute;
  top: .25rem;
  right: .25rem;
  bottom: .25rem;
  padding: 0 .4rem;
  border: 0;
  background: none;
  color: var(--muted);
  opacity: 0;
}
.item:hover .more, .more:focus { opacity: 1; }
/* The actions cover the ⋯ control while it is hovered or focused. */
.actions {
  position: absolute;
  top: .25rem;
  right: .25rem;
  bottom: .25rem;
  display: none;
  gap: .25rem;
  padding-left: .25rem;
  background: var(--card);
}
.actions button { padding: 0 .5rem; font-size: .85rem; }
.more:hover + .actions, .more:focus + .actions, .actions:hover, .actions:focus-within { display: flex; }
dialog {
  width: min(28rem, calc(100vw - 2rem));
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
}
dialog h2 { margin: 0 0 1rem; font-size: 1.1rem; }
dialog label { display: grid; gap: .25rem; margin-bottom: .75rem; }
dialog input[readonly] { color: var(--muted); }
.row { display: flex; justify-content: flex-end; gap: .5rem; }
body.dragging::after {
  content: "Drop to import";
  position: fixed;
  inset: .5rem;
  display: grid;
  place-items: center;
  border: 3px dashed var(--accent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  font-size: 1.5rem;
  pointer-events: none;
}
</style>
</head>
<body>
<header>
  <input id="filter" type="search" placeholder="Type to filter, Enter to open" aria-label="Filter bookmarks" autocomplete="off" spellcheck="false">
  <button id="add" type="button">Add</button>
  <button id="export" type="button">Export</button>
</header>
<div id="storage-notice" class="bar" role="status" hidden></div>
<div id="prompt" class="bar" role="status" hidden>
  You deleted bookmarks that are not reflected in <code>previous.json</code> yet.<button id="prompt-export" type="button">Export previous.json</button>
</div>
<div id="notice" class="bar" role="status" hidden></div>
<main>
  <p id="empty" class="hint" hidden>Drop your bookmarks.html or bookmarks.json here</p>
  <p id="nomatch" class="hint" hidden>No bookmarks match.</p>
  <ul id="grid"></ul>
</main>
<dialog id="editor">
  <form id="editor-form" method="dialog">
    <h2 id="editor-heading">Add bookmark</h2>
    <label>URL <input id="editor-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" required></label>
    <label>Title <input id="editor-title" type="text" autocomplete="off"></label>
    <p id="editor-error" class="error" role="alert" hidden></p>
    <div class="row">
      <!-- Not a submit button: Enter must trigger Save, the default button. -->
      <button id="editor-cancel" type="button">Cancel</button>
      <button type="submit" value="save">Save</button>
    </div>
  </form>
</dialog>
<script id="previous" type="application/json">/*PREVIOUS*/</script>
<script>
(() => {
'use strict';

/*CORE*/

const KEY_PREVIOUS = 'nullmarks.previous';
const KEY_LOCAL = 'nullmarks.local';
const KEY_EXPORTED = 'nullmarks.exported';
const NOTICE_MS = 8000;

const byId = (id) => document.getElementById(id);
const grid = byId('grid');
const filter = byId('filter');
const editor = byId('editor');
const editorForm = byId('editor-form');
const editorUrl = byId('editor-url');
const editorTitle = byId('editor-title');
const editorError = byId('editor-error');

// ---- Storage: every access is guarded; a problem disables all writes. ----

const storage = openStorage();
let storageProblem = storage ? '' : 'Storage is disabled in this browser';

function openStorage() {
  try {
    const store = window.localStorage;
    if (!store) return null;
    store.getItem(KEY_LOCAL); // Some privacy settings only throw on access.
    return store;
  } catch {
    return null;
  }
}

function load(key, isValid) {
  if (!storage) return null;
  try {
    const raw = storage.getItem(key);
    if (raw === null) return null;
    const value = JSON.parse(raw);
    if (isValid(value)) return value;
  } catch {
    // Falls through to the problem below.
  }
  // Keep the unreadable data untouched rather than overwrite it.
  storageProblem = 'Saved bookmarks could not be read';
  return null;
}

function save(key, value) {
  if (storageProblem) return;
  try {
    storage.setItem(key, JSON.stringify(value));
  } catch {
    storageProblem = 'Saving failed (storage is full or blocked)';
  }
}

// ---- State ----

const inlined = JSON.parse(byId('previous').textContent);
const refreshed = refreshPrevious(load(KEY_PREVIOUS, (v) => isStore(v, true)), inlined);
let previous = refreshed.store;
let local = load(KEY_LOCAL, (v) => isStore(v, false)) || { data: [], deleted: [] };
let exportedHash = load(KEY_EXPORTED, (v) => typeof v === 'string');
if (refreshed.changed) save(KEY_PREVIOUS, previous);

/** Merged view currently rendered, and its DOM items for filtering. */
let view = [];
let items = [];

function commit(next) {
  if (next.previous && next.previous !== previous) {
    previous = next.previous;
    save(KEY_PREVIOUS, previous);
  }
  if (next.local && next.local !== local) {
    local = next.local;
    save(KEY_LOCAL, local);
  }
  render();
}

// ---- Rendering ----

function hostOf(url) {
  try {
    return new URL(url).hostname;
  } catch {
    return url;
  }
}

function makeButton(text, className) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = text;
  return button;
}

function makeItem(entry) {
  const host = hostOf(entry.url);
  const label = entry.title || host;

  const tile = document.createElement('span');
  tile.className = 'tile';
  tile.setAttribute('aria-hidden', 'true');
  tile.textContent = (Array.from(label)[0] || '?').toUpperCase();
  tile.style.backgroundColor = `hsl(${fnv1a(host) % 360} 55% 40%)`;

  const text = document.createElement('span');
  text.className = 'label';
  text.textContent = label;

  const link = document.createElement('a');
  link.className = 'bm';
  link.href = entry.url;
  link.title = entry.url;
  link.append(tile, text);

  const more = makeButton('⋯', 'more');
  more.setAttribute('aria-label', `Actions for ${label}`);
  const actions = document.createElement('span');
  actions.className = 'actions';
  const edit = makeButton('Edit', 'edit');
  const remove = makeButton('Delete', 'delete');
  actions.append(edit, remove);

  const li = document.createElement('li');
  li.className = 'item';
  li.dataset.url = entry.url;
  li.append(link, more, actions);
  return li;
}

function render() {
  view = merge(previous, local);
  const fragment = document.createDocumentFragment();
  items = view.map((entry) => {
    const el = makeItem(entry);
    fragment.append(el);
    return { entry, el, text: `${entry.title} ${entry.url}`.toLowerCase() };
  });
  grid.replaceChildren(fragment);
  byId('empty').hidden = view.length > 0;
  applyFilter();
  byId('prompt').hidden = !needsExport(previous, local, exportedHash);
  const storageNotice = byId('storage-notice');
  storageNotice.hidden = !storageProblem;
  storageNotice.textContent = storageProblem ? `${storageProblem}: changes will not be saved.` : '';
}

let noticeTimer = 0;
function notify(message, isError = false) {
  const notice = byId('notice');
  notice.textContent = message;
  notice.classList.toggle('error', isError);
  notice.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice.hidden = true; }, NOTICE_MS);
}

// ---- Filter and keyboard ----

function applyFilter() {
  const query = filter.value.trim().toLowerCase();
  let shown = 0;
  for (const item of items) {
    const match = !query || item.text.includes(query);
    item.el.hidden = !match;
    if (match) shown++;
  }
  byId('nomatch').hidden = shown > 0 || items.length === 0;
}

filter.addEventListener('input', applyFilter);

filter.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    const first = items.find((item) => !item.el.hidden);
    if (first) location.assign(first.entry.url);
  } else if (event.key === 'Escape') {
    event.preventDefault();
    if (filter.value) {
      filter.value = '';
      applyFilter();
    } else {
      filter.blur();
    }
  }
});

// Typing anywhere moves focus to the filter; the key then lands in it.
document.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key.length !== 1 || event.key === ' ' || editor.open) return;
  const target = event.target;
  if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable) return;
  filter.focus();
});

// ---- Add, edit, delete ----

let editingUrl = null;

function openEditor(entry) {
  editingUrl = entry ? entry.url : null;
  byId('editor-heading').textContent = entry ? 'Edit bookmark' : 'Add bookmark';
  editorUrl.value = entry ? entry.url : '';
  editorUrl.readOnly = Boolean(entry);
  editorTitle.value = entry ? entry.title : '';
  editorError.hidden = true;
  editor.showModal();
  (entry ? editorTitle : editorUrl).focus();
}

byId('editor-cancel').addEventListener('click', () => editor.close());

editorForm.addEventListener('submit', (event) => {
  try {
    if (editingUrl) {
      commit({ local: renameEntry(local, editingUrl, editorTitle.value.trim()) });
    } else {
      const result = addEntry(previous, local, editorUrl.value, editorTitle.value);
      commit(result);
      notify(`Added ${result.url}`);
    }
  } catch (error) {
    event.preventDefault(); // Keeps the dialog open.
    editorError.textContent = error.message;
    editorError.hidden = false;
  }
});

byId('add').addEventListener('click', () => openEditor(null));

grid.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const url = button.closest('.item').dataset.url;
  if (button.classList.contains('more')) {
    button.focus(); // Firefox on macOS does not focus buttons on click.
  } else if (button.classList.contains('edit')) {
    openEditor(view.find((entry) => entry.url === url));
  } else if (button.classList.contains('delete')) {
    commit(deleteEntry(previous, local, url));
    notify(`Deleted ${url}`);
  }
});

// ---- Export ----

function exportPrevious() {
  const current = merge(previous, local);
  const text = `${JSON.stringify(toPreviousJson(current), null, 2)}\n`;
  const href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = href;
  link.download = 'previous.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
  exportedHash = hashEntries(current);
  save(KEY_EXPORTED, exportedHash);
  render();
}

byId('export').addEventListener('click', exportPrevious);
byId('prompt-export').addEventListener('click', exportPrevious);

// ---- Drag and drop import ----

function parseBookmarkFile(text) {
  const start = text.trimStart();
  if (start.startsWith('{') || start.startsWith('[')) {
    let doc;
    try {
      doc = JSON.parse(text);
    } catch {
      throw new Error('this file is not valid JSON.');
    }
    return dedupe(fromJson(doc));
  }
  // DOMParser is inert: scripts in the file do not run, nothing is loaded.
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const anchors = Array.from(doc.querySelectorAll('a[href]'), (a) => ({ href: a.getAttribute('href'), text: a.textContent }));
  return dedupe(fromAnchors(anchors));
}

async function importFile(file) {
  let entries;
  try {
    entries = parseBookmarkFile(await file.text());
  } catch (error) {
    notify(`Could not import ${file.name}: ${error.message}`, true);
    return;
  }
  if (entries.length === 0) {
    notify(`Could not import ${file.name}: no http(s) bookmarks found.`, true);
    return;
  }
  const result = applyImport(previous, local, entries);
  commit(result);
  notify(`Imported ${file.name}: ${result.added} new bookmark${result.added === 1 ? '' : 's'} added.`);
}

const carriesFiles = (event) => Boolean(event.dataTransfer) && Array.from(event.dataTransfer.types).includes('Files');
let dragDepth = 0;

document.addEventListener('dragenter', (event) => {
  if (!carriesFiles(event)) return;
  dragDepth++;
  document.body.classList.add('dragging');
});
document.addEventListener('dragleave', (event) => {
  if (!carriesFiles(event)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove('dragging');
});
document.addEventListener('dragover', (event) => {
  if (!carriesFiles(event)) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});
document.addEventListener('drop', (event) => {
  event.preventDefault(); // Never let the browser navigate to the file.
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const file = event.dataTransfer && event.dataTransfer.files[0];
  if (file) importFile(file);
});

render();
})();
</script>
</body>
</html>
